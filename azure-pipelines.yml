name: 1.0.$(Rev:.r)

trigger:
 branches:
   include:
   - main
variables:
 nomUtilisateur: 'DevOps Engineer'

pool:
  name: MonPoolLocal
  demands:
  - HasPaymentService

jobs:
- job: JobValidation
  displayName: 'Validation et Test'
  steps:
  - checkout: self
  - script: |
     echo "Bonjour,$(nomUtilisateur)!"
     echo "Execution surnle pool local reussie."
    displayName: 'Afficher le message personnalisé'


